# Fabrication automatique de l'app, sur une machine Windows prêtée par GitHub.
#
# À chaque envoi de code sur GitHub :
#   1. installe Python et les bibliothèques, et prépare FFmpeg (version figée, empreinte vérifiée) ;
#   2. lance les tests automatiques ;
#   3. fabrique UGC-Studio.exe ;
#   4. démarre le .exe pour vérifier qu'il fonctionne (autotest avec captures d'écran et vrais
#      exports vidéo), puis le relance en affichage agrandi (125 % et 150 %) pour relever les textes
#      coupés, et mesure son temps de démarrage à côté de ceux de la version 2.0.0 et de la
#      précédente (seulement si l'étape touche au démarrage) ;
#   5. joint le .exe et le rapport au « run » (onglet Actions du dépôt) ;
#   6. sur la branche main uniquement : publie une Release « v<version> » avec le .exe,
#      si cette version n'a pas encore été publiée.
#
# Sur main, après la fusion d'une étape, le code est en général exactement celui de sa branche,
# déjà fabriqué et vérifié : la Release reprend alors ce .exe au lieu de tout refaire (voir le
# travail « deja_fabrique » et outils/empreinte_du_code.py). La Release publie ainsi exactement le
# .exe dont les captures ont été relues, environ 13 minutes plus tôt. (Raison de départ : le dépôt
# était privé, et GitHub comptait les minutes de ses machines ; quota d'octobre épuisé le
# 04/10/2026. Dépôt public depuis le 06/10/2026.)

name: Fabrication de l'app

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: write # publier les Releases, ranger les branches fusionnées
  pull-requests: read # retrouver les branches des Pull Requests fusionnées
  actions: read # retrouver et reprendre le .exe déjà fabriqué et vérifié sur la branche d'une étape

concurrency:
  group: fabrication-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Sur main uniquement. L'empreinte du code (outils/empreinte_du_code.py) résume le contenu exact de
  # tous les fichiers, documentation mise à part : après la fusion d'une étape, main a la même que la
  # branche de l'étape. Si un .exe a été fabriqué pour cette empreinte par une fabrication réussie
  # (tests et autotest passés), on le garde. Une machine Linux suffit pour chercher : elle démarre
  # vite et ses minutes coûtent moins cher.
  deja_fabrique:
    name: Déjà fabriqué et vérifié ?
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.chercher.outputs.run }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Chercher le .exe de ce code, fabriqué sur sa branche
        id: chercher
        env:
          GH_TOKEN: ${{ github.token }}
          DEPOT: ${{ github.repository }}
        run: |
          empreinte=$(python3 outils/empreinte_du_code.py)
          trouve=""
          for run in $(gh api "repos/$DEPOT/actions/artifacts?name=UGC-Studio-exe-$empreinte&per_page=20" --jq '.artifacts[] | select(.expired | not) | .workflow_run.id'); do
            if [ "$(gh api "repos/$DEPOT/actions/runs/$run" --jq .conclusion)" = "success" ]; then
              trouve=$run
              break
            fi
          done
          if [ -n "$trouve" ]; then
            echo "Ce code a déjà été fabriqué et vérifié (run $trouve) : la Release reprendra ce .exe."
          else
            echo "Ce code n'a pas encore été fabriqué : fabrication complète."
          fi
          echo "run=$trouve" >> "$GITHUB_OUTPUT"

  windows:
    name: Tests et .exe Windows
    needs: deja_fabrique
    # Sur les branches : toujours. Sur main : seulement si ce code n'a pas déjà été fabriqué et vérifié
    # (ou si la recherche a échoué : dans le doute, on refait tout).
    if: ${{ !cancelled() && needs.deja_fabrique.outputs.run == '' }}
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      # Elle donne son nom au .exe joint au run : main pourra le retrouver et le reprendre.
      - name: Empreinte du code (sans la documentation)
        id: empreinte
        run: |
          $empreinte = python outils/empreinte_du_code.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "empreinte=$empreinte" >> $env:GITHUB_OUTPUT

      - name: Installer les bibliothèques
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          New-Item -ItemType Directory -Force -Path rapport | Out-Null
          python -m pip freeze | Out-File -Encoding utf8 rapport/versions.txt

      # FFmpeg (V3, exports vidéo) : la version 9.0.2 « essentials » de gyan.dev, figée. Son archive,
      # et sa copie compressée pour le .exe (xz), sont gardées en cache d'une fabrication à l'autre (la
      # clé change avec sa version, son empreinte et la façon de le compresser).
      - name: Garder l'archive de FFmpeg (cache)
        uses: actions/cache@v6
        with:
          path: outils/cache
          key: ffmpeg-9.0.2-essentials-60f467265b1e-xz6

      - name: Préparer FFmpeg 9.0.2 (empreinte vérifiée)
        run: |
          python outils/preparer_ffmpeg.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # Ce que sait faire ce FFmpeg (version, x265 en 10 bits, ProRes, FFV1), joint au rapport.
          $ffmpeg = "ugc_studio/ressources/ffmpeg/ffmpeg.exe"
          & $ffmpeg -hide_banner -version | Out-File -Encoding utf8 rapport/ffmpeg.txt
          foreach ($encodeur in @("libx265", "libx264", "prores_ks", "ffv1")) {
            & $ffmpeg -hide_banner -h "encoder=$encodeur" | Out-File -Encoding utf8 -Append rapport/ffmpeg.txt
          }
          Get-Content rapport/ffmpeg.txt -TotalCount 1

      - name: Tests automatiques
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # Sortie copiée dans le rapport : en cas de plantage, on y voit le dernier test lancé.
          python -m pytest -v --junitxml=rapport/tests.xml -o faulthandler_timeout=300 2>&1 | Tee-Object -FilePath rapport/pytest.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Fabriquer UGC-Studio.exe
        run: |
          python -m PyInstaller packaging/ugc_studio.spec --noconfirm --clean --distpath dist --workpath build
          Get-ChildItem build -Recurse -Filter "warn-*.txt" | Copy-Item -Destination rapport/
          $taille = (Get-Item dist/UGC-Studio.exe).Length / 1MB
          "Taille du .exe : {0:N1} Mo" -f $taille | Tee-Object -FilePath rapport/taille-exe.txt

      - name: Démarrer le .exe (autotest sur l'écran Windows)
        timeout-minutes: 8
        run: |
          $dossier = Join-Path $PWD "rapport/autotest-ecran"
          $p = Start-Process -FilePath "dist/UGC-Studio.exe" -ArgumentList @("--autotest", "`"$dossier`"") -Wait -PassThru
          Get-Content (Join-Path $dossier "autotest.json") -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { Write-Error "L'autotest du .exe a échoué (code $($p.ExitCode))"; exit 1 }

      - name: Captures d'écran en taille réelle (sans écran)
        timeout-minutes: 8
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $dossier = Join-Path $PWD "rapport/captures"
          $p = Start-Process -FilePath "dist/UGC-Studio.exe" -ArgumentList @("--autotest", "`"$dossier`"", "--captures-taille-fixe") -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Warning "Captures incomplètes (code $($p.ExitCode))" }

      # Affichage agrandi (V4 ; demande de l'utilisateur du 06/10/2026) : beaucoup d'écrans d'ordinateur
      # portable sont réglés à 125 % ou 150 % dans Windows. Le même autotest, sans écran, avec Qt
      # agrandi d'autant (QT_SCALE_FACTOR) : les textes s'y mesurent un peu autrement. Un texte coupé
      # ou un bouton qui déborde fait échouer la fabrication ; les autres vérifications (certaines
      # mesurent la disposition au pixel près, pour l'écran à 100 %) sont signalées en avertissement
      # (outils/affichage_agrandi.py). Seules les captures des modules sont gardées dans le rapport.
      - name: Affichage agrandi (125 % et 150 %)
        timeout-minutes: 15
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $echelles = [ordered]@{ "125" = "1.25"; "150" = "1.5" }
          foreach ($pourcent in $echelles.Keys) {
            $dossier = Join-Path $PWD "rapport/captures-$pourcent"
            $env:QT_SCALE_FACTOR = $echelles[$pourcent]
            $p = Start-Process -FilePath "dist/UGC-Studio.exe" -ArgumentList @("--autotest", "`"$dossier`"", "--captures-taille-fixe") -Wait -PassThru
            Remove-Item Env:QT_SCALE_FACTOR
            Write-Host "Affichage à $pourcent % : autotest terminé (code $($p.ExitCode))"
            Get-ChildItem $dossier -Filter "*.png" -ErrorAction SilentlyContinue | Where-Object { $_.Name -notlike "module-*" } | Remove-Item
          }
          python outils/affichage_agrandi.py rapport/captures-125 rapport/captures-150
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # Temps de démarrage (V3) : FFmpeg est dans le .exe, mais dans une ressource que le démarrage ne
      # recopie pas (il l'est au premier export). Le .exe de la version 2.0.0 (sans FFmpeg), celui de la
      # version précédente (2.2.0) et celui-ci sont lancés à tour de rôle (2.0.0, 2.2.0, celui-ci, puis
      # à nouveau), jusqu'à l'apparition de leur fenêtre : si la machine prêtée ralentit pendant la
      # mesure, les trois en pâtissent de la même façon (mesurés l'un après l'autre, le dernier pouvait
      # paraître 3 s plus lent, lot 3). Le premier tour ne compte pas (l'antivirus de Windows examine
      # chaque .exe à son premier lancement). Ensuite, pour chacun, le plus rapide de 5 lancements : la
      # machine prêtée ne fait qu'ajouter du temps (d'un lancement à l'autre, de 4 à 11 s pour un même
      # .exe, lot 3), le plus rapide est donc le plus proche du temps propre à l'app ; puis les
      # médianes et le détail. Les écarts d'une fabrication à l'autre viennent de la machine prêtée :
      # seule la comparaison sur une même fabrication compte.
      # Depuis le 04/10/2026 (quand le dépôt était privé et les minutes de GitHub comptées) : seulement
      # quand une étape touche à ce qui fait le démarrage (la recette du .exe, les bibliothèques, le
      # lancement de l'app, FFmpeg). Sinon, 3 minutes de moins par fabrication, pour une mesure qui ne
      # changerait pas.
      - name: Faut-il mesurer le démarrage ?
        id: demarrage
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $fichiers = gh api "repos/${{ github.repository }}/compare/main...${{ github.sha }}" --jq ".files[].filename"
          $touche = @($fichiers | Where-Object { $_ -match '^(packaging/|lancer_ugc_studio\.py$|requirements\.txt$|ugc_studio/app\.py$|ugc_studio/exports/ffmpeg\.py$|outils/preparer_ffmpeg\.py$)' })
          Write-Host "Fichiers qui touchent au démarrage : $($touche -join ', ')"
          "mesurer=$(if ($touche.Count -gt 0) { 'oui' } else { 'non' })" >> $env:GITHUB_OUTPUT

      - name: Mesurer le démarrage (2.0.0, 2.2.0 et cette version)
        if: steps.demarrage.outputs.mesurer == 'oui'
        timeout-minutes: 10
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v2.0.0 --pattern UGC-Studio.exe --dir ancien --clobber
          gh release download v2.2.0 --pattern UGC-Studio.exe --dir precedente --clobber
          function Lancer([string] $exe) {
            $chrono = [Diagnostics.Stopwatch]::StartNew()
            $p = Start-Process -FilePath $exe -PassThru
            $fenetre = $false
            while (-not $fenetre -and $chrono.Elapsed.TotalSeconds -lt 60) {
              Start-Sleep -Milliseconds 50
              $enfants = @(Get-CimInstance Win32_Process -Filter "ParentProcessId = $($p.Id)" | ForEach-Object { $_.ProcessId })
              foreach ($numero in @($p.Id) + $enfants) {
                $processus = Get-Process -Id $numero -ErrorAction SilentlyContinue
                if ($processus -and $processus.MainWindowHandle -ne 0) { $fenetre = $true }
              }
            }
            $secondes = $chrono.Elapsed.TotalSeconds
            Get-CimInstance Win32_Process -Filter "ParentProcessId = $($p.Id)" | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 3
            return $secondes
          }
          function Mediane($valeurs) {
            $triees = @($valeurs | Sort-Object)
            return $triees[[int][Math]::Floor($triees.Count / 2)]
          }
          function LePlusRapide($valeurs) {
            return (@($valeurs) | Measure-Object -Minimum).Minimum
          }
          $exes = [ordered]@{ "2.0.0" = "ancien/UGC-Studio.exe"; "2.2.0" = "precedente/UGC-Studio.exe"; "cette version" = "dist/UGC-Studio.exe" }
          $mesures = @{}
          foreach ($nom in $exes.Keys) { $mesures[$nom] = @() }
          foreach ($tour in 1..6) {
            foreach ($nom in $exes.Keys) {
              $secondes = Lancer $exes[$nom]
              if ($tour -gt 1) { $mesures[$nom] += $secondes }
            }
          }
          $ancien = LePlusRapide $mesures["2.0.0"]
          $precedente = LePlusRapide $mesures["2.2.0"]
          $nouveau = LePlusRapide $mesures["cette version"]
          $resume = "Démarrage jusqu'à la fenêtre, le plus rapide de 5 lancements (les trois .exe à tour de rôle) : 2.0.0 = {0:N2} s ; 2.2.0 = {1:N2} s ; cette version = {2:N2} s ; écart avec la 2.0.0 = {3:N2} s" -f $ancien, $precedente, $nouveau, ($nouveau - $ancien)
          $medianes = "Médianes : 2.0.0 = {0:N2} s ; 2.2.0 = {1:N2} s ; cette version = {2:N2} s" -f (Mediane $mesures["2.0.0"]), (Mediane $mesures["2.2.0"]), (Mediane $mesures["cette version"])
          $lignes = @($resume, $medianes)
          foreach ($nom in $exes.Keys) { $lignes += "  {0} : {1}" -f $nom, (($mesures[$nom] | ForEach-Object { "{0:N2}" -f $_ }) -join " ; ") }
          $lignes | Tee-Object -FilePath rapport/demarrage.txt

      # Gardés 7 jours (30 jusqu'au 04/10/2026) : le stockage de GitHub est compté (500 Mo inclus par
      # mois) ; le rapport reste aussi dans sa référence cachée, et chaque version publiée garde son .exe.
      - name: Joindre le rapport (tests, autotest, captures)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rapport
          path: rapport/
          retention-days: 7

      # Copie du rapport dans une référence Git cachée (refs/rapports/<branche>), invisible dans
      # la liste des branches : Claude peut ainsi relire les captures d'écran depuis son espace
      # de travail, qui n'a pas accès aux fichiers joints des runs.
      - name: Déposer le rapport pour relecture (référence cachée)
        if: always()
        continue-on-error: true
        env:
          JETON: ${{ github.token }}
          DEPOT: ${{ github.repository }}
          BRANCHE: ${{ github.ref_name }}
        run: |
          $copie = Join-Path $env:RUNNER_TEMP "rapport-git"
          New-Item -ItemType Directory -Force -Path $copie | Out-Null
          Copy-Item -Recurse -Force rapport/* $copie
          Set-Location $copie
          git init -q
          git config user.name "Fabrication automatique"
          git config user.email "actions@users.noreply.github.com"
          git config core.autocrlf false
          git add -A
          git commit -q -m "Rapport de fabrication $env:GITHUB_SHA"
          # GitHub répond parfois « Internal Server Error » pendant un moment (les 3 essais à 5 s
          # d'écart ont tous échoué au lot 2 de la V4, le 06/10/2026) : 5 essais, de plus en plus
          # espacés (15, 30, 45 puis 60 s).
          for ($essai = 1; $essai -le 5; $essai++) {
            $sortie = git push -f "https://x-access-token:$env:JETON@github.com/$env:DEPOT.git" "HEAD:refs/rapports/$env:BRANCHE" 2>&1
            if ($LASTEXITCODE -eq 0) { Write-Host "Rapport déposé."; exit 0 }
            if ($essai -lt 5) { Start-Sleep -Seconds (15 * $essai) }
          }
          Write-Output "::warning title=Rapport non déposé::$($sortie -join ' | ')"
          exit 1

      # Joint seulement si tout ce qui précède a réussi (tests, .exe, autotest) : sa présence vaut
      # vérification. Son nom porte l'empreinte du code, pour que main puisse le reprendre.
      - name: Joindre UGC-Studio.exe
        uses: actions/upload-artifact@v7
        with:
          name: UGC-Studio-exe-${{ steps.empreinte.outputs.empreinte }}
          path: dist/UGC-Studio.exe
          retention-days: 7

  # Sur main : la Release « v<version> » avec le .exe vérifié (celui de la branche de l'étape, ou
  # celui fabriqué juste avant si le code n'avait pas encore été fabriqué), si cette version n'a pas
  # encore été publiée ; puis le rangement des branches fusionnées. Sur une machine Linux.
  publication:
    name: Release et rangement (main)
    needs: [deja_fabrique, windows]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (needs.windows.result == 'success' || (needs.windows.result == 'skipped' && needs.deja_fabrique.outputs.run != '')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      DEPOT: ${{ github.repository }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Récupérer le .exe vérifié
        env:
          RUN_VERIFIE: ${{ needs.deja_fabrique.outputs.run }}
        run: |
          run="${RUN_VERIFIE:-$GITHUB_RUN_ID}"
          empreinte=$(python3 outils/empreinte_du_code.py)
          gh run download "$run" --repo "$DEPOT" --name "UGC-Studio-exe-$empreinte" --dir dist
          ls -l dist/UGC-Studio.exe

      - name: Publier la Release
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' ugc_studio/__init__.py)
          etiquette="v$version"
          if gh release view "$etiquette" --repo "$DEPOT" > /dev/null 2>&1; then
            echo "La Release $etiquette existe déjà : rien à publier."
            exit 0
          fi
          options=("$etiquette" dist/UGC-Studio.exe --repo "$DEPOT" --title "UGC Studio $version" --generate-notes --target "$GITHUB_SHA")
          case "$version" in 0.*) options+=(--prerelease) ;; esac
          gh release create "${options[@]}"

      # Les branches des étapes déjà fusionnées (et leur rapport caché) ne servent plus :
      # on les supprime pour garder la liste des branches propre.
      - name: Ranger les branches déjà fusionnées
        run: |
          for branche in $(gh pr list --repo "$DEPOT" --state merged --limit 100 --json headRefName --jq '.[].headRefName'); do
            if [ -z "$branche" ] || [ "$branche" = "main" ]; then continue; fi
            for ref in "heads/$branche" "rapports/$branche"; do
              if gh api -X DELETE "repos/$DEPOT/git/refs/$ref" > /dev/null 2>&1; then echo "Supprimé : $ref"; fi
            done
          done
